name: Autonomous AI Public State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-ai-state.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autonomous-ai-public-state
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public state branch
        uses: actions/checkout@v4
        with:
          ref: autonomous-ai-state
          fetch-depth: 0

      - name: Read real crypto economy
        run: node autonomous-ai/economy.mjs

      - name: Run one economy-grounded AI cycle
        run: node autonomous-ai/cycle.mjs

      - name: Persist economic and reasoning state
        run: |
          git config user.name "autonomous-ai[bot]"
          git config user.email "autonomous-ai[bot]@users.noreply.github.com"
          git add autonomous-ai/state.json autonomous-ai/economy.json
          if git diff --cached --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "autonomous-ai: economy cycle $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:autonomous-ai-state

# runner revision: economy-grounded-v1
