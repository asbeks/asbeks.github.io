name: Autonomous AI Public State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-ai-state.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: autonomous-ai-public-state
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout public state branch
        uses: actions/checkout@v4
        with:
          ref: autonomous-ai-state
          fetch-depth: 0

      - name: Read real crypto economy
        run: node autonomous-ai/economy.mjs

      - name: Scout public paid work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node autonomous-ai/jobs.mjs

      - name: Select best viable job autonomously
        run: node autonomous-ai/select-job.mjs

      - name: Run one job-and-economy grounded AI cycle
        run: node autonomous-ai/cycle.mjs

      - name: Synchronize operational state to Supabase
        run: node autonomous-ai/sync-supabase.mjs

      - name: Persist Git history backup
        run: |
          git config user.name "autonomous-ai[bot]"
          git config user.email "autonomous-ai[bot]@users.noreply.github.com"
          git add autonomous-ai/state.json autonomous-ai/economy.json autonomous-ai/jobs.json
          if git diff --cached --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "autonomous-ai: operating cycle $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:autonomous-ai-state

# runner revision: competition-aware-market-v1
